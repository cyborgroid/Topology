<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QE Analog Topology</title>
  <link rel="icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <!-- 다이어그램 뷰 -->
  <nav id="crumbs" class="panel crumbs"></nav>
  <aside id="info" class="panel info" hidden></aside>
  <div id="diagram-hint" class="panel hint">
    <b>Drag</b> 구조 돌려 보기 · <b>Click</b> 선택 · <b>Scroll ↑</b> 가리킨 폴더로 들어가기 · <b>Scroll ↓</b> 나오기
    · <b>Space</b>/<b>Shift+Space</b> 위·아래에서 보기 · <b>Home</b> 전체 · <b>Tab</b> 데스크톱
  </div>

  <!-- 데스크톱 뷰 -->
  <aside id="depth-gauge" class="panel gauge"></aside>

  <div id="start-menu" class="start-menu" hidden>
    <input class="start-search" placeholder="앱 검색…" />
    <div class="start-builtins"></div>
    <div class="start-label">설치된 앱</div>
    <div class="start-apps"></div>
    <button class="start-quit">⏻ Topology 종료</button>
  </div>

  <div class="taskbar">
    <button id="start-btn" class="start-btn"><img src="assets/icon.svg" alt="" /> Topology</button>
    <div id="view-switch" class="view-switch">
      <button data-view="diagram" title="다이어그램 뷰 (Tab)">◈ 다이어그램</button>
      <button data-view="desktop" title="데스크톱 뷰 (Tab)">▣ 데스크톱</button>
    </div>
    <div id="task-list" class="task-list"></div>
    <div class="tray">
      <span id="tray-pos"></span>
      <button id="tray-net" class="tray-net"></button>
      <span id="tray-bat"></span>
      <span id="tray-clock"></span>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
