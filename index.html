<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QE Analog Topology</title>
  <link rel="icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <div id="hint" class="hint">
    <b>QE Analog Topology</b> · Scroll 전진/후진 · Shift+Scroll 좌우 · Space 상승 · Shift+Space 하강 · Drag 시선 · Home 원위치
    · 노드 클릭 = 펼치기 · 더블클릭 = 열기
  </div>

  <div id="start-menu" class="start-menu" hidden>
    <input class="start-search" placeholder="앱 검색…" />
    <div class="start-builtins"></div>
    <div class="start-label">설치된 앱</div>
    <div class="start-apps"></div>
    <button class="start-quit">⏻ Topology 종료</button>
  </div>

  <div class="taskbar">
    <button id="start-btn" class="start-btn"><img src="assets/icon.svg" alt="" /> Topology</button>
    <button id="home-btn" class="home-btn" title="홈 시점 (Home)">◎</button>
    <div id="task-list" class="task-list"></div>
    <div class="tray">
      <span id="tray-pos" title="Topology 좌표"></span>
      <button id="tray-net" class="tray-net"></button>
      <span id="tray-bat"></span>
      <span id="tray-clock"></span>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
